<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E6E6E6" />
    </linearGradient>
    <filter id="smoke" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0.8 0 0 0 0  0.95 1 0 0 0  0.8 0.9 1 0 0  0 0 0 0.35 0" />
    </filter>
    <radialGradient id="smokeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5A8A4A" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="transparent" />
  <circle cx="620" cy="140" r="170" fill="url(#smokeGlow)" filter="url(#smoke)" />
  <text x="50%" y="42%" dominant-baseline="middle" text-anchor="middle" font-family="Bebas Neue, Arial, sans-serif" font-size="150" letter-spacing="20" fill="url(#textGlow)">
    IGNITE
  </text>
  <text x="50%" y="72%" dominant-baseline="middle" text-anchor="middle" font-family="Barlow Condensed, Arial, sans-serif" font-size="28" letter-spacing="8" fill="#FFFFFF" opacity="0.85">
    Individual Coaching
  </text>
</svg>
